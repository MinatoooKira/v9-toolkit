[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v9-toolkit"
version = "0.1.0"
description = "Protenix pair-rep + GPR pipeline for ProteinGym DMS prediction (v9 strategy)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "MinatoooKira"}]
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "torch>=2.0",
    "fair-esm>=2.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
v9 = "v9pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["v9pipeline*"]
